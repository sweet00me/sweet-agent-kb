# Sweet Research Agent 私有站点；供 /etc/nginx/sites-available 使用，不托管项目或 Storage。
# 仅管理员确认后安装。现有 Tailscale HTTP 8080 项目保持原样，拟新增 HTTPS 443。
map $http_x_forwarded_proto $sweet_forwarded_proto {
    default $scheme;
    https https;
}

# 限制浏览器跨站请求；不是用户鉴权。Tailnet ACL 仍必须限制可访问主体。
map $http_origin $sweet_bad_origin {
    default 1;
    "" 0;
    "https://sweetserver.taile94715.ts.net" 0;
    "http://127.0.0.1:8088" 0;
    "http://localhost:8088" 0;
}

server {
    listen 127.0.0.1:8088;
    server_name sweetserver.taile94715.ts.net localhost 127.0.0.1;
    root /srv/sweet-research-agent/current;
    index index.html;
    server_tokens off;
    autoindex off;
    # 不在访问日志中记录用户文件相对路径、检索词或请求 ID。
    access_log off;

    # 在 server 层重新包含完整 MIME 表，再补充 PDF.js 模块的 .mjs 类型。
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type application/octet-stream;

    # 后端文件上限为 50 MiB；额外 2 MiB 给 multipart 边界等请求开销。
    client_max_body_size 52m;
    client_body_timeout 300s;
    send_timeout 3600s;

    if ($sweet_bad_origin) { return 403; }

    location = /api { return 404; }
    location ^~ /api/ {
        # 无尾斜杠：保留 /api 前缀以及原始方法、请求体、Range 和下载响应头。
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sweet_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 禁止代理层自动重试聊天或审批 POST，保留后端错误和幂等语义。
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_redirect off;
    }

    location ~ (^|/)\. { return 404; }
    location ~* \.(?:py|pyc|ts|tsx|sqlite|sqlite3|db|sql|env|map)$ { return 404; }

    # 共享的不可变哈希资源池保留旧版本，使已打开页面的延迟加载仍能工作。
    location /assets/ {
        root /srv/sweet-research-agent;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location /pdfjs/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
